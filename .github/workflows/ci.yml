name: CI

on:
  push:
    branches: [new_architecture, main]
  pull_request:
    branches: [new_architecture, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app

      - name: Ruff format check
        run: ruff format --check app

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aino
          POSTGRES_PASSWORD: aino_test
          POSTGRES_DB: aino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: src
    env:
      DATABASE_URL: postgresql+asyncpg://aino:aino_test@localhost:5432/aino_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Apply migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -v --tb=short
